<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your download is being prepared</title>
<script src="resources.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fdf6f3;
    margin: 0;
    padding: 24px 16px 60px;
    color: #4a2f33;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin: 12px 0 24px;
    color: #b06b7a;
  }
  .cal-embed {
    width: 100%;
    height: 650px;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(176,107,122,0.15);
  }
  .skip-btn {
    display: block;
    margin: 28px auto 0;
    background: none;
    border: none;
    color: #9a7a80;
    text-decoration: underline;
    font-size: 0.95rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Your download is being prepared</h1>
    <iframe class="cal-embed" id="calFrame" src=""></iframe>
    <button class="skip-btn" id="skipBtn">Thanks but I'll do it on my own</button>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("r");
  const resource = RESOURCES[slug];

  // Build the cal.com iframe src, embed=true gives the clean embed view
  document.getElementById("calFrame").src = CAL_LINK + "?embed=true";

  function goToThanks() {
    window.location.href = "thanks.html?r=" + encodeURIComponent(slug || "");
  }

  document.getElementById("skipBtn").addEventListener("click", goToThanks);

  // Listen for a successful cal.com booking and redirect automatically
  window.addEventListener("message", function (event) {
    if (typeof event.data === "object" && event.data && event.data.type === "CAL:bookingSuccessful") {
      goToThanks();
    }
  });

  if (!resource) {
    console.warn("No resource found for slug:", slug);
  }
</script>
</body>
</html>
