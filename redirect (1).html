    border: none;

  <div class="wrap">
    <h1>Your download is being prepared</h1>

    <div style="width:100%;height:650px;overflow:scroll" id="my-cal-inline-intro-call-with-jenni"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("r");
  const resource = RESOURCES[slug];

  function goToThanks() {
    window.location.href = "thanks.html?r=" + encodeURIComponent(slug || "");
  }

  document.getElementById("skipBtn").addEventListener("click", goToThanks);

  // Redirect automatically once a booking is confirmed
  Cal.ns["intro-call-with-jenni"]("on", {
