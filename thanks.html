<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Here's your download!</title>
<script src="resources.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fdf6f3;
    margin: 0;
    padding: 60px 16px;
    color: #4a2f33;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    color: #b06b7a;
    margin-bottom: 12px;
  }
  p {
    color: #6f5559;
    margin-bottom: 28px;
  }
  .download-btn {
    display: inline-block;
    background: #b06b7a;
    color: #fff;
    padding: 14px 32px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
  }
  .missing {
    color: #a33;
  }
</style>
</head>
<body>
  <div id="content">Loading...</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("r");
  const resource = RESOURCES[slug];
  const el = document.getElementById("content");

  if (resource) {
    el.innerHTML = `
      <h1>Here's your download!💛</h1>
      <p>${resource.title} is ready for you.</p>
      <a class="download-btn" href="${resource.downloadUrl}" download>Download now</a>
    `;
  } else {
    el.innerHTML = `<p class="missing">We couldn't find that resource. Please check the link and try again.</p>`;
  }
</script>
</body>
</html>
